[program:rosely-comfyui]
command=/opt/rosely-h3-zit-serverless/start_comfyui.sh
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=PROC_NAME="rosely-comfyui"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rosely-h3-sync]
command=/opt/rosely-h3-zit-serverless/start_h3_sync.sh
priority=15
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stopasgroup=true
killasgroup=true
environment=PROC_NAME="rosely-h3-sync"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rosely-voice-sync]
command=/opt/rosely-h3-zit-serverless/start_voice_sync.sh
priority=16
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stopasgroup=true
killasgroup=true
environment=PROC_NAME="rosely-voice-sync"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rosely-model-server]
command=/opt/rosely-h3-zit-serverless/start_model_server.sh
priority=20
autostart=true
