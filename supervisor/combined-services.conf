[program:rosely-comfyui]
command=/opt/rosely-h3-zit-serverless/start_comfyui.sh
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=PROC_NAME="rosely-comfyui"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rosely-model-server]
command=/opt/rosely-h3-zit-serverless/start_model_server.sh
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PROC_NAME="rosely-model-server"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
